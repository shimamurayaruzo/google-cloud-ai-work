<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" role="img" aria-label="着替えの確認の流れ。声をかけて返事があれば記録し、返事がなければ少し置いてもう一度、それでも取れなければ家族に知らせる"><defs><marker id="arrowThree" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs><g font-family="IBM Plex Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11.5"><rect x="15" y="80" width="140" height="50" rx="5" fill="var(--accent)" opacity="0.6"/><text x="85" y="101" text-anchor="middle" fill="var(--paper)">朝の着替えの時間に</text><text x="85" y="118" text-anchor="middle" fill="var(--paper)">責めない言葉で声かけ</text><line x1="157" y1="105" x2="192" y2="105" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrowThree)"/><rect x="195" y="80" width="120" height="50" rx="5" fill="var(--paper)" stroke="var(--ink)"/><text x="255" y="101" text-anchor="middle" fill="var(--ink)">返事を聞く</text><text x="255" y="118" text-anchor="middle" fill="var(--ink)">カメラは使わない</text><line x1="317" y1="92" x2="372" y2="45" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrowThree)"/><text x="335" y="58" fill="var(--ok)">「替えたよ」</text><rect x="375" y="20" width="140" height="50" rx="5" fill="var(--paper)" stroke="var(--ok)" stroke-width="1.5"/><text x="445" y="41" text-anchor="middle" fill="var(--ok)">できた、と記録</text><text x="445" y="58" text-anchor="middle" fill="var(--ok)">夕方の報告に載る</text><line x1="317" y1="118" x2="372" y2="165" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrowThree)"/><text x="322" y="160" fill="var(--warn)">「まだ」や無反応</text><rect x="375" y="140" width="140" height="50" rx="5" fill="var(--accent)" opacity="0.6"/><text x="445" y="161" text-anchor="middle" fill="var(--paper)">少し置いて</text><text x="445" y="178" text-anchor="middle" fill="var(--paper)">もう一度だけ声かけ</text><line x1="517" y1="165" x2="552" y2="165" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrowThree)"/><rect x="555" y="140" width="130" height="50" rx="5" fill="var(--paper)" stroke="var(--warn)" stroke-width="1.5"/><text x="620" y="161" text-anchor="middle" fill="var(--warn)">それでも取れなければ</text><text x="620" y="178" text-anchor="middle" fill="var(--warn)">家族に知らせる</text><text x="15" y="225" fill="var(--muted)">2 回声をかけて確認が取れないときだけ家族に届く。毎回は届かないので、通知に慣れて無視することがない。</text></g></svg>
