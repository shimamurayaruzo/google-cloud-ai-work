<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-label="見守りエージェントの全体像。寝室モードとお風呂モードの iPad、Cloud Run の中の状態機械・ADK の会話ターン・運用エージェント、Gemini・Firestore、家族の LINE、運用の Slack、医師・ケアマネの関係">
  <!-- 2026-10-07 更新: 起動モード（寝室／お風呂）と、Cloud Run の中身（状態機械・ADK の会話ターン・運用エージェント）を入れた。
       PNG は scripts/video/record.ts が Playwright で撮り直す（system-overview.png、2 倍） -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5650"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b4443c"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a86f14"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f5b"/></marker>
  </defs>
  <rect width="1400" height="820" fill="#ffffff"/>
  <g font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, Yu Gothic, Meiryo, sans-serif">
    <text x="50" y="58" font-size="30" font-weight="700" fill="#1f2a24">見守りエージェント　全体像</text>
    <text x="50" y="88" font-size="15" fill="#64707C">iPad は寝室とお風呂の 2 つのモード。判断は Cloud Run、家族には LINE、運用には Slack。外へ出す判断だけは家族が握る。</text>

    <!-- 左: 母の部屋・脱衣所 / iPad -->
    <rect x="50" y="130" width="310" height="430" rx="14" fill="#F6F8FA" stroke="#DEE2E6" stroke-width="1.5"/>
    <text x="70" y="164" font-size="17" font-weight="700" fill="#1f2a24">母の部屋・脱衣所</text>
    <rect x="80" y="182" width="160" height="200" rx="16" fill="#fff" stroke="#1f2a24" stroke-width="3"/>
    <rect x="92" y="196" width="136" height="172" rx="8" fill="#e3efe9"/>
    <circle cx="160" cy="282" r="54" fill="#ffe6c4"/>
    <path d="M132 276 q7 -8 14 0" stroke="#3b3330" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M174 276 q7 -8 14 0" stroke="#3b3330" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M142 298 q18 16 36 0" stroke="#3b3330" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="300" cy="250" r="20" fill="#fff" stroke="#1f2a24" stroke-width="2"/>
    <path d="M267 330 Q300 275 333 330 Z" fill="#fff" stroke="#1f2a24" stroke-width="2"/>
    <text x="300" y="356" font-size="13" text-anchor="middle" fill="#1f2a24">母</text>
    <text x="160" y="408" font-size="18" font-weight="700" text-anchor="middle" fill="#1f2a24">iPad</text>
    <text x="160" y="430" font-size="13" text-anchor="middle" fill="#4a5650">顔・マイク・スピーカー。判断はしない</text>
    <rect x="68" y="448" width="274" height="44" rx="8" fill="#fbf7ef" stroke="#c9bfae"/>
    <text x="82" y="476" font-size="15" font-weight="700" fill="#1f2a24">寝室モード</text>
    <text x="170" y="476" font-size="12.5" fill="#4a5650">時計・声かけ・居場所の答え</text>
    <rect x="68" y="500" width="274" height="44" rx="8" fill="#eef6f4" stroke="#9fd0bf"/>
    <text x="82" y="528" font-size="15" font-weight="700" fill="#1f2a24">お風呂モード</text>
    <text x="182" y="528" font-size="12.5" fill="#4a5650">体を洗う・歯磨きの声かけ</text>

    <!-- 中央: サーバー -->
    <rect x="460" y="130" width="480" height="430" rx="14" fill="#fff" stroke="#1f6f5b" stroke-width="3"/>
    <text x="700" y="166" font-size="20" font-weight="700" text-anchor="middle" fill="#1f2a24">サーバー（Cloud Run）</text>
    <text x="700" y="188" font-size="13" text-anchor="middle" fill="#64707C">頭脳は全部ここ。Google Cloud 上で動く</text>

    <rect x="480" y="204" width="440" height="76" rx="8" fill="#e3efe9"/>
    <text x="496" y="232" font-size="15" font-weight="700" fill="#1f2a24">① 状態機械（自前）</text>
    <text x="496" y="258" font-size="13" fill="#4a5650">予定から計画。時刻・再確認・至急の段階・夕方の要約を起動</text>

    <rect x="480" y="290" width="440" height="76" rx="8" fill="#e3efe9"/>
    <text x="496" y="318" font-size="15" font-weight="700" fill="#1f2a24">② ADK の会話ターン（TypeScript）</text>
    <text x="496" y="344" font-size="13" fill="#4a5650">返事を分類して次を決める。型付きの道具を権限の段階で止める</text>

    <rect x="480" y="376" width="440" height="76" rx="8" fill="#f7e3e0"/>
    <text x="496" y="404" font-size="15" font-weight="700" fill="#1f2a24">③ 運用エージェント（自分を見張る）</text>
    <text x="496" y="430" font-size="13" fill="#4a5650">止まっていたら気づく。再試行・代わりの手段に切替え、Slack に報告</text>

    <rect x="480" y="462" width="440" height="76" rx="8" fill="#f6ecd6"/>
    <text x="496" y="490" font-size="15" font-weight="700" fill="#1f2a24">④ 権限の段階（止まる場所）</text>
    <text x="496" y="516" font-size="13" fill="#4a5650">家族へは自動／外部へは承認後／本人の依頼で外へは連絡しない</text>

    <!-- サーバーの下: Gemini / Firestore / Scheduler・Tasks -->
    <line x1="535" y1="562" x2="535" y2="608" stroke="#1f6f5b" stroke-width="2"/>
    <line x1="700" y1="562" x2="700" y2="608" stroke="#1f6f5b" stroke-width="2"/>
    <line x1="865" y1="562" x2="865" y2="608" stroke="#1f6f5b" stroke-width="2"/>
    <rect x="460" y="610" width="150" height="88" rx="10" fill="#fff" stroke="#2563EB" stroke-width="1.8"/>
    <text x="535" y="638" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2a24">Gemini</text>
    <text x="535" y="660" font-size="12.5" text-anchor="middle" fill="#4a5650">Vertex AI 経由</text>
    <text x="535" y="680" font-size="12.5" text-anchor="middle" fill="#4a5650">会話の判断・言い回し</text>
    <rect x="625" y="610" width="150" height="88" rx="10" fill="#fff" stroke="#a86f14" stroke-width="1.8"/>
    <text x="700" y="638" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2a24">Firestore</text>
    <text x="700" y="660" font-size="12.5" text-anchor="middle" fill="#4a5650">記録・日次状態・設定</text>
    <text x="700" y="680" font-size="12.5" text-anchor="middle" fill="#4a5650">通知・行動台帳</text>
    <rect x="790" y="610" width="150" height="88" rx="10" fill="#fff" stroke="#4a5650" stroke-width="1.8"/>
    <text x="865" y="638" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2a24">Scheduler／Tasks</text>
    <text x="865" y="660" font-size="12.5" text-anchor="middle" fill="#4a5650">朝の計画・再確認</text>
    <text x="865" y="680" font-size="12.5" text-anchor="middle" fill="#4a5650">18 時の要約</text>

    <!-- 右上: 家族 / LINE -->
    <rect x="1030" y="130" width="320" height="280" rx="14" fill="#F6F8FA" stroke="#DEE2E6" stroke-width="1.5"/>
    <text x="1050" y="164" font-size="17" font-weight="700" fill="#1f2a24">家族（仕事中）</text>
    <rect x="1050" y="180" width="280" height="44" rx="8" fill="#06C755"/>
    <text x="1190" y="209" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">LINE ＋ 家族の画面</text>
    <rect x="1050" y="234" width="280" height="38" rx="6" fill="#fff" stroke="#2563EB"/>
    <text x="1190" y="258" font-size="13" text-anchor="middle" fill="#1f2a24">夕方 18 時に「今日の様子」</text>
    <rect x="1050" y="280" width="280" height="38" rx="6" fill="#fff" stroke="#b4443c"/>
    <text x="1190" y="304" font-size="13" text-anchor="middle" fill="#b4443c">「痛い」は確認のお願い、無反応 3 回は至急</text>
    <rect x="1050" y="326" width="280" height="38" rx="6" fill="#fff" stroke="#1f6f5b"/>
    <text x="1190" y="350" font-size="13" text-anchor="middle" fill="#1f6f5b">お風呂で体を洗い始めたらお知らせ</text>
    <text x="1190" y="392" font-size="12.5" text-anchor="middle" fill="#64707C">「確認した」を押すと段階上げが止まる</text>

    <!-- 右中: 医師・ケアマネ -->
    <rect x="1030" y="430" width="320" height="100" rx="14" fill="#F6F8FA" stroke="#DEE2E6" stroke-width="1.5"/>
    <text x="1050" y="462" font-size="17" font-weight="700" fill="#1f2a24">医師・ケアマネジャー</text>
    <text x="1050" y="486" font-size="13" fill="#4a5650">受診や面談で使う、直近の様子のまとめ</text>
    <rect x="1050" y="496" width="180" height="26" rx="13" fill="#fff" stroke="#a86f14"/>
    <text x="1140" y="514" font-size="12.5" text-anchor="middle" fill="#a86f14">家族が承認してから届く</text>

    <!-- 右下: 運用 / Slack -->
    <rect x="1030" y="550" width="320" height="148" rx="14" fill="#F6F8FA" stroke="#DEE2E6" stroke-width="1.5"/>
    <text x="1050" y="584" font-size="17" font-weight="700" fill="#1f2a24">運用（開発チーム）</text>
    <rect x="1050" y="600" width="280" height="46" rx="8" fill="#4A154B"/>
    <text x="1190" y="630" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">Slack　#mother</text>
    <text x="1190" y="676" font-size="12.5" text-anchor="middle" fill="#4a5650">障害・復旧の報告だけ。母の会話は流さない</text>

    <!-- 矢印: iPad ↔ サーバー -->
    <line x1="460" y1="250" x2="366" y2="250" stroke="#4a5650" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="412" y="240" font-size="13" text-anchor="middle" fill="#4a5650">声かけ</text>
    <line x1="366" y1="320" x2="458" y2="320" stroke="#4a5650" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="412" y="345" font-size="13" text-anchor="middle" fill="#4a5650">返事</text>
    <line x1="366" y1="400" x2="458" y2="400" stroke="#4a5650" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
    <text x="412" y="425" font-size="12" text-anchor="middle" fill="#64707C">生存信号</text>
    <line x1="458" y1="500" x2="366" y2="500" stroke="#1f6f5b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ag)"/>
    <text x="412" y="490" font-size="12" text-anchor="middle" fill="#1f6f5b">モード</text>

    <!-- 矢印: サーバー → LINE -->
    <line x1="942" y1="252" x2="1028" y2="252" stroke="#4a5650" stroke-width="2.5" marker-end="url(#a)"/>
    <line x1="942" y1="300" x2="1028" y2="300" stroke="#b4443c" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="985" y="241" font-size="12.5" text-anchor="middle" fill="#4a5650">自動</text>
    <text x="985" y="324" font-size="12.5" text-anchor="middle" fill="#b4443c">すぐ知らせる</text>
    <line x1="1028" y1="370" x2="944" y2="370" stroke="#1f6f5b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ag)"/>
    <text x="985" y="392" font-size="12" text-anchor="middle" fill="#1f6f5b">確認した・切替</text>

    <!-- 家族 → 医師（承認） -->
    <line x1="1190" y1="412" x2="1190" y2="428" stroke="#a86f14" stroke-width="2.5" marker-end="url(#aw)"/>
    <text x="1210" y="424" font-size="12.5" fill="#a86f14">承認</text>

    <!-- サーバー → Slack -->
    <line x1="942" y1="430" x2="1028" y2="610" stroke="#4a5650" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="1000" y="540" font-size="12.5" text-anchor="middle" fill="#4a5650">運用の報告</text>

    <!-- 凡例 -->
    <g font-size="12.5" fill="#4a5650">
      <line x1="50" y1="748" x2="90" y2="748" stroke="#4a5650" stroke-width="2.5"/><text x="98" y="753">自動で行う</text>
      <line x1="190" y1="748" x2="230" y2="748" stroke="#b4443c" stroke-width="2.5"/><text x="238" y="753">すぐ知らせる（確認のお願い・至急）</text>
      <line x1="470" y1="748" x2="510" y2="748" stroke="#a86f14" stroke-width="2.5"/><text x="518" y="753">家族の承認が要る</text>
      <line x1="650" y1="748" x2="690" y2="748" stroke="#4a5650" stroke-width="1.5" stroke-dasharray="6 5"/><text x="698" y="753">信号・ボタン（人の操作や機械の生存確認）</text>
      <text x="50" y="790" fill="#64707C">カメラは使わない。音声は保存しない。診断しない。お風呂モードも安全を見張る装置ではない（進み具合を知らせるだけ）。</text>
    </g>
  </g>
</svg>
