<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" role="img" aria-label="一日の流れ。朝に声かけの時刻と内容を決めて家族が承認し、日中は声かけと記録、夕方に今日の様子を届け、必要なときは緊急連絡か確認のお願いをする"><defs><marker id="arrowTwo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs><g font-family="IBM Plex Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11.5"><rect x="10" y="10" width="160" height="200" rx="8" fill="var(--paper-dim)" stroke="var(--line)"/><text x="90" y="34" text-anchor="middle" font-weight="700" fill="var(--ink)">朝 6 時</text><rect x="180" y="10" width="160" height="200" rx="8" fill="var(--paper-dim)" stroke="var(--line)"/><text x="260" y="34" text-anchor="middle" font-weight="700" fill="var(--ink)">日中</text><rect x="350" y="10" width="160" height="200" rx="8" fill="var(--paper-dim)" stroke="var(--line)"/><text x="430" y="34" text-anchor="middle" font-weight="700" fill="var(--ink)">夕方 18 時</text><rect x="520" y="10" width="170" height="200" rx="8" fill="var(--paper-dim)" stroke="var(--line)"/><text x="605" y="34" text-anchor="middle" font-weight="700" fill="var(--ink)">必要なとき</text><rect x="25" y="52" width="130" height="46" rx="5" fill="var(--accent)" opacity="0.6"/><text x="90" y="71" text-anchor="middle" fill="var(--paper)">予定を読み</text><text x="90" y="88" text-anchor="middle" fill="var(--paper)">声かけの時刻と内容を決める</text><line x1="90" y1="100" x2="90" y2="122" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrowTwo)"/><rect x="25" y="126" width="130" height="46" rx="5" fill="var(--paper)" stroke="var(--warn)" stroke-width="1.5"/><text x="90" y="145" text-anchor="middle" fill="var(--ink)">家族が計画を</text><text x="90" y="162" text-anchor="middle" fill="var(--ink)">承認して開始</text><line x1="157" y1="112" x2="192" y2="112" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrowTwo)"/><rect x="195" y="52" width="130" height="46" rx="5" fill="var(--accent)" opacity="0.6"/><text x="260" y="71" text-anchor="middle" fill="var(--paper)">決まった時間に</text><text x="260" y="88" text-anchor="middle" fill="var(--paper)">声をかける</text><line x1="260" y1="100" x2="260" y2="122" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrowTwo)"/><rect x="195" y="126" width="130" height="46" rx="5" fill="var(--accent)" opacity="0.6"/><text x="260" y="145" text-anchor="middle" fill="var(--paper)">返事を聞いて</text><text x="260" y="162" text-anchor="middle" fill="var(--paper)">記録する</text><line x1="327" y1="112" x2="362" y2="112" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrowTwo)"/><rect x="365" y="52" width="130" height="46" rx="5" fill="var(--accent)" opacity="0.6"/><text x="430" y="71" text-anchor="middle" fill="var(--paper)">一日の会話を</text><text x="430" y="88" text-anchor="middle" fill="var(--paper)">まとめる</text><line x1="430" y1="100" x2="430" y2="122" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrowTwo)"/><rect x="365" y="126" width="130" height="46" rx="5" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.5"/><text x="430" y="145" text-anchor="middle" fill="var(--ink)">家族の LINE に</text><text x="430" y="162" text-anchor="middle" fill="var(--ink)">「今日の様子」</text><rect x="535" y="52" width="140" height="46" rx="5" fill="var(--paper)" stroke="var(--err)" stroke-width="1.5"/><text x="605" y="71" text-anchor="middle" fill="var(--err)">「痛い」や無反応</text><text x="605" y="88" text-anchor="middle" fill="var(--err)">すぐ家族へ</text><rect x="535" y="126" width="140" height="46" rx="5" fill="var(--paper)" stroke="var(--warn)" stroke-width="1.5"/><text x="605" y="145" text-anchor="middle" fill="var(--warn)">様子の変化が続く</text><text x="605" y="162" text-anchor="middle" fill="var(--warn)">確認してほしい</text><text x="20" y="240" fill="var(--muted)">青：エージェントが自分で行う。橙：家族の判断を待つ。赤：緊急で即時に知らせる。</text><text x="20" y="262" fill="var(--muted)">母の側の操作は不要。朝に家族が一度 iPad をタップすれば、あとは自動で回る。</text></g></svg>
