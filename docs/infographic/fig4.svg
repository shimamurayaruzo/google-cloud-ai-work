<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" role="img" aria-label="外への連絡の 3 段階。家族へは自動、医師やケアマネへは家族の承認後、本人に頼まれた外部連絡はしない"><g font-family="IBM Plex Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11.5"><rect x="10" y="15" width="680" height="56" rx="6" fill="var(--paper-dim)" stroke="var(--line)"/><rect x="24" y="30" width="90" height="26" rx="13" fill="var(--ok)"/><text x="69" y="47" text-anchor="middle" fill="var(--paper)" font-weight="700">自動</text><text x="130" y="39" fill="var(--ink)">家族への通知、夕方の「今日の様子」、緊急の連絡</text><text x="130" y="58" fill="var(--muted)">エージェントが判断して送る。根拠になった会話を添える</text><rect x="10" y="83" width="680" height="56" rx="6" fill="var(--paper-dim)" stroke="var(--line)"/><rect x="24" y="98" width="90" height="26" rx="13" fill="var(--warn)"/><text x="69" y="115" text-anchor="middle" fill="var(--paper)" font-weight="700">承認後</text><text x="130" y="107" fill="var(--ink)">医師やケアマネジャーへの、直近の様子の共有</text><text x="130" y="126" fill="var(--muted)">家族が画面で中身を確かめ、必要なら一文だけ直してから送る</text><rect x="10" y="151" width="680" height="56" rx="6" fill="var(--paper-dim)" stroke="var(--line)"/><rect x="24" y="166" width="90" height="26" rx="13" fill="var(--err)"/><text x="69" y="183" text-anchor="middle" fill="var(--paper)" font-weight="700">しない</text><text x="130" y="175" fill="var(--ink)">本人に「電話して」と頼まれた外部への連絡</text><text x="130" y="194" fill="var(--muted)">かけずに、家族へ「こう頼まれました」と伝えるだけ</text></g></svg>
