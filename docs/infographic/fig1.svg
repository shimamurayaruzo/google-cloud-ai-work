<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" role="img" aria-label="市販の見守り製品は動いたか押したかを見る。見守りエージェントは会話の中身からどう過ごしたかを知る"><defs><marker id="arrowOne" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs><g font-family="IBM Plex Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11.5"><rect x="10" y="10" width="320" height="230" rx="8" fill="var(--paper-dim)" stroke="var(--line)"/><text x="30" y="36" font-weight="700" fill="var(--ink)">市販の見守り製品</text><rect x="30" y="52" width="130" height="34" rx="5" fill="var(--accent)" opacity="0.35"/><text x="95" y="73" text-anchor="middle" fill="var(--ink)">センサー：動いた</text><rect x="30" y="96" width="130" height="34" rx="5" fill="var(--accent)" opacity="0.35"/><text x="95" y="117" text-anchor="middle" fill="var(--ink)">カメラ：映った</text><rect x="30" y="140" width="130" height="34" rx="5" fill="var(--accent)" opacity="0.35"/><text x="95" y="161" text-anchor="middle" fill="var(--ink)">ボタン：押した</text><line x1="165" y1="113" x2="200" y2="113" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrowOne)"/><rect x="205" y="90" width="110" height="46" rx="5" fill="var(--paper)" stroke="var(--ink)"/><text x="260" y="109" text-anchor="middle" fill="var(--ink)">分かること</text><text x="260" y="126" text-anchor="middle" fill="var(--ink)">生きているか</text><text x="30" y="215" fill="var(--muted)">何を話し、どんな様子だったかは分からない</text><rect x="370" y="10" width="320" height="230" rx="8" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.5"/><text x="390" y="36" font-weight="700" fill="var(--ink)">見守りエージェント</text><rect x="390" y="52" width="130" height="34" rx="5" fill="var(--accent)" opacity="0.6"/><text x="455" y="73" text-anchor="middle" fill="var(--paper)">声をかける</text><rect x="390" y="96" width="130" height="34" rx="5" fill="var(--accent)" opacity="0.6"/><text x="455" y="117" text-anchor="middle" fill="var(--paper)">返事を聞く</text><rect x="390" y="140" width="130" height="34" rx="5" fill="var(--accent)" opacity="0.6"/><text x="455" y="161" text-anchor="middle" fill="var(--paper)">中身を記録する</text><line x1="525" y1="113" x2="560" y2="113" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrowOne)"/><rect x="565" y="90" width="110" height="46" rx="5" fill="var(--paper)" stroke="var(--ink)"/><text x="620" y="109" text-anchor="middle" fill="var(--ink)">分かること</text><text x="620" y="126" text-anchor="middle" fill="var(--ink)">どう過ごしたか</text><text x="390" y="215" fill="var(--muted)">食事、薬、着替え、気分、繰り返しの質問</text></g></svg>
