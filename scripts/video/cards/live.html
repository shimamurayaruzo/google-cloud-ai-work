<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>実写の差し替え用</title>
<!-- 実写カットのプレースホルダ（灰色の板）。?title=…&sub=…&note=… で文字を変える。
     record.ts が見出しの下の枠（1824×948）で撮影する。本物の映像は tmp/video/live/<id>.mp4 に置くと assemble.ts が差し替える -->
<style>
html,body{margin:0;width:1824px;height:948px;overflow:hidden;font-family:"Yu Gothic","Noto Sans JP","Meiryo",sans-serif}
.board{position:absolute;inset:0;background:repeating-linear-gradient(135deg,#8d918e 0 28px,#878b88 28px 56px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center}
.tag{font-size:34px;letter-spacing:.2em;background:rgba(0,0,0,.25);padding:8px 26px;border-radius:999px;margin-bottom:34px}
.t{font-size:92px;font-weight:700;line-height:1.3;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.s{font-size:44px;margin-top:22px;opacity:.95}
.n{position:absolute;bottom:40px;font-size:26px;opacity:.85}
</style></head>
<body><div class="board"><div class="tag">差し替え用</div><div class="t" id="t"></div><div class="s" id="s"></div><div class="n" id="n"></div></div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('t').textContent = q.get('title') || '実写';
document.getElementById('s').textContent = q.get('sub') || '';
document.getElementById('n').textContent = q.get('note') || '';
</script></body></html>
