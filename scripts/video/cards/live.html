<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>説明の板</title>
<!-- 実写カットの代わりに出す「説明の板」。左に母側画面の静止画、右に見出しと短い説明。
     ?img=img/xxx.png&title=見出し&line=1 行目&line=2 行目&line=3 行目 で中身を変える（line は何行でも。%0A で行の中を改行）。
     record.ts が見出しの下の枠（1824×948）で撮影する。本物の映像は tmp/video/live/<区間 id かカット id>.mp4 に置くと assemble.ts が差し替える。
     img/ の静止画は、仮組み 2 回目の録画（tmp/video/check/c03-mid.png・c05-mid.png）から母側画面の枠だけを切り出したもの -->
<style>
:root{--accent:#1f6f5b;--ink:#1f2a24;--sub:#4a5a52;--bg:#f7f8f5;--line:#d9dfda}
html,body{margin:0;width:1824px;height:948px;overflow:hidden;background:var(--bg);font-family:"Yu Gothic","YuGothic","Noto Sans JP","Meiryo",sans-serif;color:var(--ink)}
.board{position:absolute;inset:0;display:flex;align-items:center;padding:0 64px;gap:72px;box-sizing:border-box}
.shot{flex:0 0 60%;width:60%}
.shot img{display:block;width:100%;height:auto;border-radius:28px;border:1px solid var(--line);box-shadow:0 10px 32px rgba(31,42,36,.12)}
.text{flex:1;min-width:0}
.t{font-size:50px;font-weight:700;line-height:1.35;margin:0 0 44px;padding-left:26px;border-left:10px solid var(--accent)}
ul{list-style:none;margin:0;padding:0}
li{position:relative;white-space:pre-line;font-size:33px;font-weight:600;line-height:1.5;color:var(--sub);padding-left:40px;margin:0 0 30px}
li::before{content:"";position:absolute;left:4px;top:.55em;width:16px;height:16px;border-radius:50%;background:var(--accent)}
</style></head>
<body><div class="board">
  <div class="shot"><img id="img" alt=""></div>
  <div class="text"><h1 class="t" id="t"></h1><ul id="lines"></ul></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const img = document.getElementById('img');
if (q.get('img')) img.src = q.get('img'); else document.querySelector('.shot').remove();
document.getElementById('t').textContent = q.get('title') || '';
const ul = document.getElementById('lines');
for (const l of q.getAll('line')) { const li = document.createElement('li'); li.textContent = l; ul.appendChild(li); }
</script></body></html>
